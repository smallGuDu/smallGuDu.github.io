<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<style>
  :root{--bg:#0f1220;--text:#f4f7ff;--muted:#9aa6c3}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#2a1f45,#0f1220 60%);color:var(--text);min-height:100vh;display:flex;justify-content:center}
  .wrap{width:min(430px,100%);padding:18px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  a.back{color:#ffb4d9;text-decoration:none;font-weight:600}
  .score{background:rgba(255,255,255,.08);padding:8px 12px;border-radius:999px}
  button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#ff7eb6,#ffd36e);color:#1a1020}
  h1{margin:0 0 6px} .sub{color:var(--muted);margin:0 0 12px}
  .board{position:relative;background:#171427;border-radius:18px;padding:10px;aspect-ratio:1;touch-action:none}
  .grid,.tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;height:100%}
  .cell{background:rgba(255,255,255,.06);border-radius:12px}
  .tiles{position:absolute;inset:10px}
  .tile{display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:800;font-size:clamp(1.2rem,6vw,1.8rem);color:#1b1328}
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;border-radius:18px;font-size:1.4rem;font-weight:800}
  .overlay.show{display:flex}
  .hint{color:var(--muted);font-size:.85rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="../">← 返回</a><div class="score">分数：<span id="score">0</span></div><button id="restart">重来</button></div>
  <h1>🔢 2048</h1>
  <p class="sub">滑动或方向键合并相同数字。</p>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">游戏结束</div>
  </div>
  <p class="hint">提示：手机上直接在棋盘上滑动即可。</p>
</div>
<script>
const colors={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
const gridEl=document.getElementById('grid'), tilesEl=document.getElementById('tiles'), scoreEl=document.getElementById('score'), overlay=document.getElementById('overlay');
for(let i=0;i<16;i++){ const d=document.createElement('div'); d.className='cell'; gridEl.appendChild(d); }
let board,score,touchStart=null;
function emptyCells(){ const a=[]; for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!board[r][c]) a.push([r,c]); return a; }
function addTile(){ const e=emptyCells(); if(!e.length) return; const [r,c]=e[Math.floor(Math.random()*e.length)]; board[r][c]=Math.random()<0.9?2:4; }
function reset(){ board=Array.from({length:4},()=>Array(4).fill(0)); score=0; scoreEl.textContent=0; overlay.classList.remove('show'); addTile(); addTile(); render(); }
function render(){ tilesEl.innerHTML=''; for(let r=0;r<4;r++) for(let c=0;c<4;c++){ const v=board[r][c]; const d=document.createElement('div'); if(v){ d.className='tile'; d.textContent=v; d.style.background=colors[v]||'#3c3a32'; d.style.color=v<=4?'#776e65':'#f9f6f2'; } tilesEl.appendChild(d); } }
function slide(line){ const arr=line.filter(Boolean); for(let i=0;i<arr.length-1;i++){ if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1);} } while(arr.length<4) arr.push(0); return arr; }
function rotate(b){ return b[0].map((_,i)=>b.map(r=>r[i]).reverse()); }
function move(dir){ // 0L 1U 2R 3D
  let b=board.map(r=>r.slice()); let rotated=0;
  if(dir===1){ b=rotate(rotate(rotate(b))); rotated=3; }
  if(dir===2){ b=rotate(rotate(b)); rotated=2; }
  if(dir===3){ b=rotate(b); rotated=1; }
  let moved=false; b=b.map(row=>{ const n=slide(row); if(n.some((v,i)=>v!==row[i])) moved=true; return n; });
  for(let i=0;i<rotated;i++) b=rotate(b);
  if(!moved) return;
  board=b; scoreEl.textContent=score; addTile(); render();
  if(!emptyCells().length && !canMove()) overlay.classList.add('show');
}
function canMove(){ for(let r=0;r<4;r++) for(let c=0;c<4;c++){ const v=board[r][c]; if((c<3&&board[r][c+1]===v)||(r<3&&board[r+1][c]===v)) return true; } return false; }
document.addEventListener('keydown',e=>{ const map={ArrowLeft:0,a:0,ArrowUp:1,w:1,ArrowRight:2,d:2,ArrowDown:3,s:3}; const k=e.key.length===1?e.key.toLowerCase():e.key; if(k in map){ e.preventDefault(); move(map[k]); }});
const boardEl=document.getElementById('board');
boardEl.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; touchStart={x:t.clientX,y:t.clientY}; },{passive:true});
boardEl.addEventListener('touchend',e=>{ if(!touchStart) return; const t=e.changedTouches[0]; const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y; if(Math.hypot(dx,dy)<24) return; if(Math.abs(dx)>Math.abs(dy)) move(dx>0?2:0); else move(dy>0?3:1); touchStart=null; },{passive:true});
document.getElementById('restart').onclick=reset; reset();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇</title>
<style>
  :root{--bg:#0f1220;--panel:#1a2035;--text:#f4f7ff;--muted:#9aa6c3;--accent:#7cffb2;--danger:#ff7eb6}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#1d2a4d,#0f1220 60%);color:var(--text);min-height:100vh;display:flex;justify-content:center}
  .wrap{width:min(460px,100%);padding:18px}
  h1{margin:0 0 6px;font-size:1.5rem} .sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
  .bar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .score{background:rgba(255,255,255,.06);padding:8px 12px;border-radius:999px}
  button{appearance:none;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7c9cff,#7cffb2);color:#10131f}
  canvas{width:100%;aspect-ratio:1;background:#0b0f1c;border:1px solid rgba(255,255,255,.08);border-radius:18px;touch-action:none;display:block}
  .hint{color:var(--muted);font-size:.85rem;margin-top:10px;line-height:1.4}
  a.back{color:#9ec1ff;text-decoration:none;font-weight:600}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;max-width:220px}
  .pad button{background:#243157;color:#fff;padding:14px 0}
  .pad .empty{visibility:hidden}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="../">← 返回</a><div class="score">得分：<span id="score">0</span></div><button id="restart">重来</button></div>
  <h1>🐍 贪吃蛇</h1>
  <p class="sub">方向键 / WASD / 滑动 / 下方按钮都可以控制。</p>
  <canvas id="c" width="360" height="360"></canvas>
  <div class="pad">
    <div class="empty"></div><button data-d="up">↑</button><div class="empty"></div>
    <button data-d="left">←</button><button data-d="down">↓</button><button data-d="right">→</button>
  </div>
  <p class="hint">撞墙或咬到自己就结束啦。挑战更高分！</p>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const size=18; // grid
const cell=canvas.width/size;
let snake,dir,nextDir,food,score,alive,timer,touchStart=null;

function randFood(){
  while(true){
    const p={x:Math.floor(Math.random()*size),y:Math.floor(Math.random()*size)};
    if(!snake.some(s=>s.x===p.x&&s.y===p.y)) return p;
  }
}
function reset(){
  snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];
  dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; alive=true; food=randFood(); scoreEl.textContent=score;
  clearInterval(timer); timer=setInterval(tick,120); draw();
}
function setDir(nx,ny){ if(dir.x+nx===0&&dir.y+ny===0) return; nextDir={x:nx,y:ny}; }
function tick(){
  if(!alive) return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=size||head.y>=size||snake.some(s=>s.x===head.x&&s.y===head.y)){ alive=false; draw(); return; }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){ score+=10; scoreEl.textContent=score; food=randFood(); }
  else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle='#0b0f1c'; ctx.fillRect(0,0,canvas.width,canvas.height);
  // grid faint
  ctx.strokeStyle='rgba(255,255,255,.04)';
  for(let i=0;i<=size;i++){ ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(canvas.width,i*cell); ctx.stroke(); }
  ctx.fillStyle='#ff7eb6'; ctx.beginPath(); ctx.roundRect(food.x*cell+3,food.y*cell+3,cell-6,cell-6,8); ctx.fill();
  snake.forEach((s,i)=>{ ctx.fillStyle=i===0?'#7cffb2':'#7c9cff'; ctx.beginPath(); ctx.roundRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4,8); ctx.fill(); });
  if(!alive){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff'; ctx.font='bold 28px system-ui'; ctx.textAlign='center'; ctx.fillText('游戏结束',canvas.width/2,canvas.height/2-8); ctx.font='16px system-ui'; ctx.fillText('点击重来再玩一次',canvas.width/2,canvas.height/2+22); }
}
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','w'].includes(k)) setDir(0,-1);
  if(['arrowdown','s'].includes(k)) setDir(0,1);
  if(['arrowleft','a'].includes(k)) setDir(-1,0);
  if(['arrowright','d'].includes(k)) setDir(1,0);
});
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{
  const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.d]; setDir(...m);
});
canvas.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; touchStart={x:t.clientX,y:t.clientY}; },{passive:true});
canvas.addEventListener('touchend',e=>{ if(!touchStart) return; const t=e.changedTouches[0]; const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y; if(Math.hypot(dx,dy)<20) return; if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1); touchStart=null; },{passive:true});
document.getElementById('restart').onclick=reset; canvas.onclick=()=>{ if(!alive) reset(); };
if(!CanvasRenderingContext2D.prototype.roundRect){ CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){ this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); } }
reset();
</script>
</body>
</html>
